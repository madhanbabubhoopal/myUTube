name: Build KidsTube APK

on:
  push:
    branches:
      - 'claude/offline-youtube-flutter-app-qfEO1'
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT"      > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT"      >> android/local.properties
          echo "flutter.buildMode=release"      >> android/local.properties
          echo "flutter.versionName=${GITHUB_REF_NAME#v}" >> android/local.properties
          echo "flutter.versionCode=${GITHUB_RUN_NUMBER}" >> android/local.properties
          cat android/local.properties

      - name: Atomic Scaffold and Restore
        run: |
          # 1. Scaffold fresh Android files (will create .kts files)
          flutter create --platforms android --overwrite .
          
          # 2. Restore project-specific files
          git checkout pubspec.yaml lib/ test/ android/app/src/main/AndroidManifest.xml
          
          # 3. Clean up the old Groovy files to avoid conflicts
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          
          # 4. Diagnostic: Show generated files
          echo "--- GENERATED SETTINGS.GRADLE.KTS ---"
          cat android/settings.gradle.kts
          echo "--- GENERATED APP BUILD.GRADLE.KTS ---"
          cat android/app/build.gradle.kts

      - name: Install Flutter packages
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Show diff on failure
        if: failure()
        run: git diff

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidstube-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false

  robo-test:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kidstube-release-apk

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Robo Test
        run: gcloud firebase test android run --type robo --app app-release.apk --device model=redfin,version=30 --timeout 3m --robo-directives text:PIN=1234
