name: Build KidsTube APK

on:
  push:
    branches:
      - 'claude/offline-youtube-flutter-app-qfEO1'
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Bulletproof Project Setup
        run: |
          # 1. Ensure AndroidManifest.xml is backed up if it exists anywhere
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml AndroidManifest.xml.bak
          elif [ -f AndroidManifest.xml.bak ]; then
            echo "Using existing root backup"
          fi
          
          # 2. Always recreate the android folder to ensure version alignment
          rm -rf android
          flutter create . --platforms android --org com.kidstube.app
          
          # 3. Restore the custom manifest (crucial for permissions)
          if [ -f AndroidManifest.xml.bak ]; then
            mkdir -p android/app/src/main
            cp AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          fi
          
          # 4. Force STABLE Gradle/Kotlin versions
          cat <<EOF > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("\$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
              id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
          }
          include ":app"
          EOF

      - name: Create local.properties
        run: |
          echo "sdk.dir=\$ANDROID_SDK_ROOT"      > android/local.properties
          echo "flutter.sdk=\$FLUTTER_ROOT"      >> android/local.properties
          echo "flutter.buildMode=release"      >> android/local.properties
          echo "flutter.versionName=\${GITHUB_REF_NAME#v}" >> android/local.properties
          echo "flutter.versionCode=\${GITHUB_RUN_NUMBER}" >> android/local.properties

      - name: Install Flutter packages
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release --no-pub --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidstube-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false

  robo-test:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kidstube-release-apk

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: \${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Robo Test
        run: |
          gcloud firebase test android run \\
            --type robo \\
            --app app-release.apk \\
            --device model=redfin,version=30 \\
            --timeout 3m \\
            --robo-directives text:PIN=1234,click:Profile=,click:"Manage Approved Videos"=
