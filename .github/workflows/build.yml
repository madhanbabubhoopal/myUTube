name: Build KidsTube APK

on:
  push:
    branches:
      - 'claude/offline-youtube-flutter-app-qfEO1'
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Create android/local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT"      > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT"      >> android/local.properties
          echo "flutter.buildMode=release"      >> android/local.properties
          echo "flutter.versionName=${GITHUB_REF_NAME#v}" >> android/local.properties
          echo "flutter.versionCode=${GITHUB_RUN_NUMBER}" >> android/local.properties

      - name: Install Flutter packages
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :gradle:compileKotlin
          cd ..
          flutter build apk --release --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidstube-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false

  robo-test:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kidstube-release-apk

      - name: Run Firebase Robo Test
        uses: asadmansoor/android-test-lab-action@v1.2
        with:
          arg-spec: 'robo --app app-release.apk --device model=redfin,version=30 --timeout 2m --robo-directives text:parental_pin_field=1234'
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SA_KEY }}
