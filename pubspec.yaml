name: kidstube
description: A YouTube-style local video player for kids. Works fully offline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Video playback
  video_player: 2.11.1
  chewie: 1.14.1

  # Media library scanning (reads device media store)
  photo_manager: 3.9.0

  # Runtime permission requests
  permission_handler: 12.0.1

  # State management
  provider: 6.1.5+1

  # File system paths (app cache dir for thumbnails)
  path_provider: 2.1.5

  # Settings persistence
  shared_preferences: 2.5.5

  # Staggered list entry animations
  flutter_staggered_animations: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/demo_video.mp4
